name: Publish NuGet Package

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - 'Design.ORiN3.Common'
          - 'Design.ORiN3.Provider'
          - 'Message.ORiN3.Provider'
          - 'Message.ORiN3.RemoteEngine'
          - 'ORiN3.Provider.Config'
      increment:
        description: 'Version increment'
        required: true
        type: choice
        options:
          - 'patch'
          - 'minor'
          - 'major'
          - 'pre(beta)'

permissions:
  contents: write

env:
  VERSION_FILE: ${{ github.workspace }}/src/${{ inputs.package }}/${{ inputs.package }}.Version.targets
  PROJECT_PATH: ${{ github.workspace }}/src/${{ inputs.package }}/${{ inputs.package }}.csproj
  DOT_NET_VERSION: "8.0.x"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Parameters
        run: |
          echo "package: ${{ inputs.package }}"
          echo "increment: ${{ inputs.increment }}"
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOT_NET_VERSION }}
      - name: Restore dependencies
        run: dotnet restore
      - name: Call Update Version Workflow
        uses: ./.github/actions/update-version
        id: update_version
        with:
          increment: ${{ inputs.increment }}
          version_file: ${{ env.VERSION_FILE }}
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --no-build --configuration Release --logger trx --results-directory TestResults
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
        if: always()
      - name: Pack
        run: dotnet pack ${{ env.PROJECT_PATH }} --configuration Release --no-build --output nupkgs
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ${{ github.workspace }}

  test:
    needs: build
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Test
        run: dotnet test --no-build --configuration Release --logger trx --results-directory TestResults

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ORIN_RELEASE_TOKEN_HELPER_ID }}
          private-key: ${{ secrets.ORIN_RELEASE_TOKEN_HELPER_SECRET }}
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: build-output
      - name: Commit and push changes
        id: git_push
        run: |
          set -e
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}
          git add "${{ env.VERSION_FILE }}"
          git commit -m "${{ inputs.package }}のバージョンを更新"
          if git push; then
            echo "push_success=true" >> "$GITHUB_ENV"
          else
            echo "push_success=false" >> "$GITHUB_ENV"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Push NuGet Packages
        if: env.push_success == 'true'
        run: |
          for nupkg in ./nupkgs/*.nupkg
          do
            dotnet nuget push "$nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
